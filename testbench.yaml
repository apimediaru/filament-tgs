laravel: '@testbench'

providers:
  - ApiMedia\Tgs\TgsServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\WorkbenchPanelProvider

workbench:
  start: /admin
  install: true
  discovers:
    web: true
    views: true
  build:
    - create-sqlite-db
    - migrate-fresh
    - db-seed:
        --class: Workbench\Database\Seeders\DatabaseSeeder
    - storage-link:
        --force: true
    - filament-assets
    - vendor-publish:
        --tag: tgs-workbench-assets
        --force: true
